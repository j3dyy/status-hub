<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.0" />
    </linearGradient>
    <radialGradient id="radarCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="24" cy="24" r="21" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.4" />

  <!-- Middle Ring -->
  <circle cx="24" cy="24" r="15" stroke="#3b82f6" stroke-width="1.6" opacity="0.6" />

  <!-- Inner Ring -->
  <circle cx="24" cy="24" r="8" stroke="#60a5fa" stroke-width="1.4" opacity="0.8" />

  <!-- Crosshair Guides -->
  <line x1="24" y1="3" x2="24" y2="45" stroke="#3b82f6" stroke-width="1" opacity="0.25" />
  <line x1="3" y1="24" x2="45" y2="24" stroke="#3b82f6" stroke-width="1" opacity="0.25" />

  <!-- 45-Degree Radar Sweep Wedge -->
  <path d="M 24 24 L 39 9 A 21 21 0 0 1 45 24 Z" fill="url(#radarSweep)" />

  <!-- Live Blip / Target 1 (Emerald Active) -->
  <circle cx="34" cy="16" r="3.2" fill="#10b981" filter="url(#glow)" />
  <circle cx="34" cy="16" r="6" stroke="#10b981" stroke-width="0.8" opacity="0.5" />

  <!-- Live Blip / Target 2 (Cyan Edge) -->
  <circle cx="15" cy="31" r="2.2" fill="#38bdf8" opacity="0.9" />

  <!-- Center Hub Nexus -->
  <circle cx="24" cy="24" r="4.5" fill="url(#radarCenter)" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
</svg>
